{% extends "base.html" %}{% block content %}<h1>Stock transfer / স্টক স্থানান্তর</h1><section class="card"><form method="post" class="formgrid"><label>Product code / Barcode<input name="code" required class="scan-input"></label><label>From / কোথা থেকে<select name="source">{% for l in locations %}<option>{{l.name}}</option>{% endfor %}</select></label><label>To / কোথায়<select name="destination">{% for l in locations %}<option>{{l.name}}</option>{% endfor %}</select></label><label>Quantity<input name="qty" type="number" min="1" required></label><label>Note<input name="note"></label><button>Transfer stock / ট্রান্সফার</button></form></section><section class="card"><h2>Transfer history / ট্রান্সফার ইতিহাস</h2><table><tr><th>Code</th><th>Product</th><th>From</th><th>To</th><th>Qty</th><th>Date</th></tr>{% for r in history %}<tr><td>{{r.code}}</td><td>{{r.name}}</td><td>{{r.src}}</td><td>{{r.dst}}</td><td>{{r.qty}}</td><td>{{r.created_at}}</td></tr>{% endfor %}</table></section>{% endblock %}
