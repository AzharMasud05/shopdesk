{% extends "base.html" %}{% block content %}<h1>User management / ব্যবহারকারী</h1><section class="card"><h2>Create user</h2><form method="post" class="formgrid"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" minlength="8" required></label><label>Role<select name="role"><option value="manager">Manager</option><option value="salesman">Salesman</option><option value="admin">Admin</option></select></label><button>Create user</button></form></section><section class="card"><h2>Users</h2><table><tr><th>Username</th><th>Role</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.role}}</td></tr>{% endfor %}</table></section>{% endblock %}
